name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24.21.0'

jobs:
  verify:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Smoke test the compiled output
        run: node dist/index.js &
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:3000/health

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: telegram-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container and check health endpoint
        run: |
          docker run -d --name telegram-bot-ci -p 3000:3000 telegram-bot:ci
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              echo "\ncontainer is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "container did not become healthy"
          docker logs telegram-bot-ci
          exit 1
